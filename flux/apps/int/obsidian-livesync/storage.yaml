---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: couchdb-pvc
spec:
  resources:
    requests:
      storage: 2Gi
  volumeMode: Filesystem
  storageClassName: csi-zfspv
  dataSourceRef:
    kind: ReplicationDestination
    apiGroup: volsync.backube
    name: volsync-repldest-couchdb-data
  accessModes:
    - ReadWriteOnce