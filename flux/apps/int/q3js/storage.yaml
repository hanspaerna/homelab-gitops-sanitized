---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-pvc
spec:
  resources:
    requests:
      storage: 10Gi
  volumeMode: Filesystem
  storageClassName: csi-zfspv
  dataSourceRef:
    kind: ReplicationDestination
    apiGroup: volsync.backube
    name: volsync-repldest
  accessModes:
    - ReadWriteOnce