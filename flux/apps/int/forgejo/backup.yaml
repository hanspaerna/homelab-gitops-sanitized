---
apiVersion: v1
kind: Secret
metadata:
  name: volsync-repo
stringData:
  RESTIC_REPOSITORY: ${VOLSYNC_REPO_BASE}/forgejo
  RESTIC_PASSWORD: ${VOLSYNC_RESTIC_PASSWORD}
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: volsync-forgejo
spec:
  sourcePVC: forgejo-db-pvc
  trigger:
    schedule: ${VOLSYNC_SCHEDULE}
  restic:
    repository: volsync-repo
    copyMethod: Snapshot
    pruneIntervalDays: ${VOLSYNC_PRUNE_DAYS}
    retain:
      daily: ${VOLSYNC_RETAIN_DAILY}
      weekly: ${VOLSYNC_RETAIN_WEEKLY}
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: volsync-repldest
spec:
  trigger:
    manual: restore-once
  restic:
    repository: volsync-repo
    storageClassName: csi-zfspv
    copyMethod: Snapshot
    capacity: 1Gi
    accessModes: ["ReadWriteOnce"]
