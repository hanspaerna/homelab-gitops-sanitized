---
# Local PVC for app config data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: servarr-config-pvc
spec:
  resources:
    requests:
      storage: 6Gi
  volumeMode: Filesystem
  storageClassName: csi-zfspv
  dataSourceRef:
    kind: ReplicationDestination
    apiGroup: volsync.backube
    name: volsync-repldest
  accessModes:
    - ReadWriteOnce