---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: servarr-movies-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Delete
  storageClassName: ""
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: "pve.lan#movies#servarr"
    volumeAttributes:
      server: pve.lan
      share: /nethescurial/movies
  mountOptions:
    - nfsvers=4.1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: movies-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  volumeName: servarr-movies-pv
  storageClassName: ""
