---
# Local PVCs for app config data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radarr-config-pvc
  annotations:
    k8up.io/backup: "true"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
